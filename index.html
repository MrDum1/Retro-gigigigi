<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Website Gigigi</title>
</head>
<body>

    <p>Welcome to the Website Gigigi! This is a sample webpage.</p>
    <div class="camera">
        <video id="video">No Video.</video>
        <button id="start">Take a Picture!</button>
    </div>
    <canvas id="canvas" style="display: none;"></canvas>
    <div class="output">
        <img id="photo" src="" alt="The photo will be here!"/>
    </div>
    <input type="file" name="myFiles" id="fileInput" multiple>

    <label for="choices">Choose a bubble option:</label>
    <select name="options" id="options">
        <option value="option1">Regular</option>
        <option value="option2">Block</option>
    </select>

    <button id="generateButton">Generate</button>

    <script src="script gigigi"></script>
</body>
</html>
