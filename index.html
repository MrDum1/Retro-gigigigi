<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Website Gigigi</title>
    </head>

    <body>

        <div class="header">
            
            <h1 id="name">Retro Gigigi</h1>

        </div>

        <div class="content">

            <div class="camera">

                <video id="video">No Video.</video>
                <button id="start" style="margin-bottom: 10px;">Take a Picture!</button>

            </div>

            <img id="bgIMG" src="" style="position: absolute; z-index: -1; align-self: center; margin-top: 30px;">
    
            <canvas id="canvas" style="display: none;"></canvas>

            <div class="output">
                <img id="photo" src="" alt="The photo will be here!"/>
            </div>

            <div id="grid" aria-label="Puzzle pieces"></div>
            <div>
                <button id="imageSplitter">Make My Puzzle You Peasant!</button>
            </div>
            <p id="splitterStatus" role="status" aria-live="polite"></p>

            <input type="file" id="imageInput" accept="image/*">

        </div>

        <div style="display: flex; flex-direction: row;">
            <label for="choices">Choose a mode:</label>
            <select name="options" id="options">
                <option value="option1">Regular</option>
                <option value="option2">Block</option>
            </select>
        </div>

        <div class="puzzle-size">

             <p>
                Puzzle pieces (columns x rows):
                <input type="number" id="width" min="1" max="20" value="3" style="width:50px;" aria-label="Number of puzzle columns">
                x
                <input type="number" id="length" min="1" max="20" value="3" style="width:50px;" aria-label="Number of puzzle rows">
            </p>

            <script src="splitting and dragging"></script>

        </div>

        <script src="script gigigi"></script>
    
    </body>
</html>
