<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Website Gigigi</title>
    </head>

    <body>

        <div class="header">
            
            <h1 id="name">Retro Gigigi</h1>

        </div>

        <div class="content">

            <div class="camera" style="display: flex; flex-direction: column; align-items: center;">

                <video id="video">No Video.</video>
                <button id="start" style="margin: 10px;">Take a Picture!</button>

            </div>

            <img id="bgIMG" src="" style="position: absolute; z-index: -1; align-self: center; margin-top: 30px;">
    
            <canvas id="canvas" style="display: none;"></canvas>

            <div class="output">
                <img id="photo" src=""/>
            </div>
    
            <div id="grid" aria-label="Puzzle pieces"></div>

            <div>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div>
                <button id="imageSplitter">Make My Puzzle You Peasant!</button>
            </div>

        </div>

        <div class="puzzle-size">

             <p>
                Puzzle pieces (columns x rows):
                <input type="number" id="width" min="1" max="20" value="3" style="width:40px;" aria-label="Number of puzzle columns">
                x
                <input type="number" id="length" min="1" max="20" value="3" style="width:40px;" aria-label="Number of puzzle rows">
            </p>

            <script src="splitting and dragging"></script>

        </div>

        <script src="script gigigi"></script>
    
    </body>
</html>
